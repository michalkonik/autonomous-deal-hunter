# GPU taxonomy. Key = <category>:<id>:<vram_gb>. `vram` lists the real variants; `default_vram` is used (certainty 0.7)
# when a listing names the chip but not the memory and the chip has more than one variant. The default is the
# LOWER-priced variant, so a defaulted match can never inflate a comparable price (3060 is the one exception: the
# 12 GB card is the original and the common one).
# `bare_ok: true` = the name is distinctive enough to match without a brand prefix or GPU context word.
# Short datacenter names that collide with phones/other products (A100, H100, H200, A10, A30, A40, L4, L40, V100) need a context
# word (nvidia, tesla, gpu, ...) instead.
# Ids are parsed by dh/taxonomy.py: first token rtx|rx|arc is the series (prefix), the rest is the model.
gpu:
  # ---- NVIDIA RTX 20
  - {id: rtx-2060, vram: [6, 12], default_vram: 6}
  - {id: rtx-2060-super, vram: [8], default_vram: 8}
  - {id: rtx-2070, vram: [8], default_vram: 8}
  - {id: rtx-2070-super, vram: [8], default_vram: 8}
  - {id: rtx-2080, vram: [8], default_vram: 8}
  - {id: rtx-2080-super, vram: [8], default_vram: 8}
  - {id: rtx-2080-ti, vram: [11], default_vram: 11}
  - {id: titan-rtx, vram: [24], default_vram: 24, bare_ok: true}
  # ---- NVIDIA RTX 30
  - {id: rtx-3050, vram: [6, 8], default_vram: 6}
  - {id: rtx-3060, vram: [8, 12], default_vram: 12}
  - {id: rtx-3060-ti, vram: [8], default_vram: 8}
  - {id: rtx-3070, vram: [8], default_vram: 8}
  - {id: rtx-3070-ti, vram: [8], default_vram: 8}
  - {id: rtx-3080, vram: [10, 12], default_vram: 10}
  - {id: rtx-3080-ti, vram: [12], default_vram: 12}
  - {id: rtx-3090, vram: [24], default_vram: 24}
  - {id: rtx-3090-ti, vram: [24], default_vram: 24}
  # ---- NVIDIA RTX 40
  - {id: rtx-4060, vram: [8], default_vram: 8}
  - {id: rtx-4060-ti, vram: [8, 16], default_vram: 8}
  - {id: rtx-4070, vram: [12], default_vram: 12}
  - {id: rtx-4070-super, vram: [12], default_vram: 12}
  - {id: rtx-4070-ti, vram: [12], default_vram: 12}
  - {id: rtx-4070-ti-super, vram: [16], default_vram: 16}
  - {id: rtx-4080, vram: [16], default_vram: 16}
  - {id: rtx-4080-super, vram: [16], default_vram: 16}
  - {id: rtx-4090, vram: [24], default_vram: 24}
  - {id: rtx-4090d, vram: [24], default_vram: 24}
  # ---- NVIDIA RTX 50
  - {id: rtx-5050, vram: [8], default_vram: 8}
  - {id: rtx-5060, vram: [8], default_vram: 8}
  - {id: rtx-5060-ti, vram: [8, 16], default_vram: 8}
  - {id: rtx-5070, vram: [12], default_vram: 12}
  - {id: rtx-5070-ti, vram: [16], default_vram: 16}
  - {id: rtx-5080, vram: [16], default_vram: 16}
  - {id: rtx-5090, vram: [32], default_vram: 32}
  - {id: rtx-5090d, vram: [32], default_vram: 32}
  # ---- NVIDIA RTX 60 (next generation; VRAM per the pre-launch leaks, widen at launch if a new ship variant appears)
  - {id: rtx-6070, vram: [12, 16], default_vram: 12}
  - {id: rtx-6080, vram: [20, 24], default_vram: 20}
  - {id: rtx-6090, vram: [32], default_vram: 32}
  # ---- AMD RX 6000
  - {id: rx-6400, vram: [4], default_vram: 4}
  - {id: rx-6500-xt, vram: [4, 8], default_vram: 4}
  - {id: rx-6600, vram: [8], default_vram: 8}
  - {id: rx-6600-xt, vram: [8], default_vram: 8}
  - {id: rx-6650-xt, vram: [8], default_vram: 8}
  - {id: rx-6700, vram: [10], default_vram: 10}
  - {id: rx-6700-xt, vram: [12], default_vram: 12}
  - {id: rx-6750-xt, vram: [12], default_vram: 12}
  - {id: rx-6800, vram: [16], default_vram: 16}
  - {id: rx-6800-xt, vram: [16], default_vram: 16}
  - {id: rx-6900-xt, vram: [16], default_vram: 16}
