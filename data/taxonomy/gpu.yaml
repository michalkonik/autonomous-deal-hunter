  - {id: rx-7900-gre, vram: [16], default_vram: 16}
  - {id: rx-7900-xt, vram: [20], default_vram: 20}
  - {id: rx-7900-xtx, vram: [24], default_vram: 24}
  # ---- AMD RX 9000
  - {id: rx-9060-xt, vram: [8, 16], default_vram: 8}
  - {id: rx-9070, vram: [16], default_vram: 16}
  - {id: rx-9070-gre, vram: [16], default_vram: 16}
  - {id: rx-9070-xt, vram: [16], default_vram: 16}
  # ---- Intel Arc
  - {id: arc-a310, vram: [4], default_vram: 4}
  - {id: arc-a380, vram: [6], default_vram: 6}
  - {id: arc-a580, vram: [8], default_vram: 8}
  - {id: arc-a750, vram: [8], default_vram: 8}
  - {id: arc-a770, vram: [8, 16], default_vram: 8}
  - {id: arc-b570, vram: [10], default_vram: 10}
  - {id: arc-b580, vram: [12], default_vram: 12}
  # ---- Datacenter / workstation
  - {id: a100, vram: [40, 80], default_vram: 40}
  - {id: h100, vram: [80, 94], default_vram: 80}
  - {id: h200, vram: [141], default_vram: 141}
  - {id: l40s, vram: [48], default_vram: 48, bare_ok: true}
  - {id: l40, vram: [48], default_vram: 48}
  - {id: l4, vram: [24], default_vram: 24}
  - {id: a40, vram: [48], default_vram: 48}
  - {id: a30, vram: [24], default_vram: 24}
  - {id: a10, vram: [24], default_vram: 24}
  - {id: v100, vram: [16, 32], default_vram: 16}
  - {id: rtx-a6000, vram: [48], default_vram: 48, bare_ok: true}
  - {id: rtx-a5000, vram: [24], default_vram: 24, bare_ok: true}
  - {id: rtx-a4500, vram: [20], default_vram: 20, bare_ok: true}
  - {id: rtx-a4000, vram: [16], default_vram: 16, bare_ok: true}
  - {id: rtx-6000-ada, vram: [48], default_vram: 48, bare_ok: true}
  - {id: rtx-5000-ada, vram: [32], default_vram: 32, bare_ok: true}
  - {id: rtx-4500-ada, vram: [24], default_vram: 24, bare_ok: true}
  - {id: rtx-4000-ada, vram: [20], default_vram: 20, bare_ok: true}
  - {id: rtx-pro-6000, vram: [96], default_vram: 96, bare_ok: true}
  - {id: rtx-pro-5000, vram: [48, 72], default_vram: 48, bare_ok: true}
  - {id: rtx-pro-4500, vram: [32], default_vram: 32, bare_ok: true}
  - {id: rtx-pro-4000, vram: [24], default_vram: 24, bare_ok: true}

