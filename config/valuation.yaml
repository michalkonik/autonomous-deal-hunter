# Exit valuation (dh/valuation.py). Not part of the frozen layer.
ask_to_sale_ratio: 0.92       # an active ask is discounted to an expected sale price (spec §6.2 item 4)
weights:                      # weight of one comparable in the weighted quantiles
  owner_sale: 1.0
  ebay_sold: 1.0
  probably_sold: 0.5          # clears-at ledger (dh/ledger.py)
  active_ask: 0.3
  ask_history: 0.2            # seeded history (dh/seed.py)
fallback:                     # weight multipliers when an exit channel has no recent comps of its own
  pl_pool: 0.7                # PL exit channel -> all PL comps (note "fallback_pl")
  eu_pool_for_pl: 0.5         # PL exit channel, no PL comps either -> all EU comps incl. PL (note "fallback_eu")
  eu_pool_for_eu: 0.7         # EU exit channel -> all EU comps incl. PL (note "fallback_eu")
ceiling_factor: 0.95          # estimate capped at lowest new-retail price × this
recent_days: 30               # comps counted for confidence and used for the quantiles
lookback_days: 90             # how far back comps are read; the trend uses min(lookback, 2 × recent) days
active_ask_max_age_days: 3    # a tracked listing still counts as a live ask if seen this recently
fx_max_back_days: 4           # cached NBP rate may be up to this many days older than the comp
fx_stale_days: 3              # note "fx_stale" only when a recent comp's rate is older than this (weekends are normal)
outlier_low: 0.5              # kept for callers; the sellable cluster below is what actually drops comps
outlier_high: 3.0             # kept for callers; a price several times the cheap cluster is not a benchmark
sellable_band: 1.35           # asks within this multiple of a cluster's cheapest price are the same market
sellable_junk: 0.15           # a cheap cluster below this fraction of the crowded cluster is accessories, not the product

gate:                         # value gate (dh/valuegate.py): evidence-and-edge screen between pricing and saving.
  enabled: true               # keep a tier only with evidence (sold comps / clear discount vs new) AND an edge
  min_sold: 3                 # (nothing meaningfully cheaper, or deep discount vs the ask median); the rest
  sold_recent_days: 180       # becomes a tier-5 watchlist item, pure market price is dropped outright.
  retail_discount: 0.85
  max_cheaper: 2
  cheaper_tolerance: 0.05     # asks within this fraction of the buy price count as equal, not cheaper
  deep_discount: 0.75
  junk_fraction: 0.25         # prices below this fraction of the pool reference are variation traps
  market_ask_ratio: 0.95      # outright drop: ask at or above this fraction of the ask median ...
  market_retail_ratio: 0.90   # ... and at or above this fraction of the new-retail floor ...
  market_min_cheaper: 10      # ... with at least this many strictly cheaper live asks around
  min_real_asks: 5            # fewer cleaned asks than this: the pool is too thin to judge market price on
  lookback_days: 90           # how far back the gate reads the key's comparables
  min_return_on_capital: 0.10 # a tier the owner acts on (1-4) needs a conservative net at least this share of the
                              # capital at risk; a thinner gap becomes a tier-5 watch. 0 turns the check off.
                              # The absolute floors in config/rules.yaml still apply.
  min_net_usd: 200            # owner 2026-11-17: a deal under 200 USD conservative net is dropped, not watched.
                              # 0 turns the floor off. Checked whenever the net is known.
  min_under_low_ask: 0.10     # the buy must be at least this far under the 2nd-cheapest sellable ask (the price
                              # a reseller actually competes with). At or near that ask is dropped, not watched.
  paperless_new_below_shop: true # a new item with no receipt and no guarantee must be strictly cheaper than the
                                 # same model's shop price. At or above that price, or with no shop price, it is a watch.

# Comparable channel and market (country) of each source. A per-adapter `channel:` key in sources.yaml
# (adapters.<source>.channel) overrides the channel name.
# allegro and allegro_lokalnie are the preferred benchmark for a used exit (used asks) and a new exit
# (new asks) whenever either has a recent comp. Other channels are used only when both are empty.
channels:
  allegro: {channel: allegro, market: PL}
  allegro_lokalnie: {channel: allegro_lokalnie, market: PL}
  olx: {channel: olx, market: PL}
  sprzedajemy: {channel: sprzedajemy, market: PL}
  ebay_pl: {channel: ebay_pl, market: PL}
  ebay_de: {channel: ebay_de, market: DE}
  ebay_gb: {channel: ebay_gb, market: GB}
  ebay_fr: {channel: ebay_fr, market: FR}
  ebay_it: {channel: ebay_it, market: IT}
  ebay_es: {channel: ebay_es, market: ES}
  ebay_ie: {channel: ebay_ie, market: IE}
  ebay_at: {channel: ebay_at, market: AT}
  ebay_ch: {channel: ebay_ch, market: CH}
  ebay_be: {channel: ebay_be, market: BE}
  ebay_us: {channel: ebay_us, market: US}
  ebay_ca: {channel: ebay_ca, market: CA}
  ebay_br: {channel: ebay_br, market: BR}  # eBay has no Brazil site; these rows are US-catalog items located in BR
  kleinanzeigen: {channel: kleinanzeigen, market: DE}
  bazos_cz: {channel: bazos_cz, market: CZ}
  bazos_sk: {channel: bazos_sk, market: SK}
  bazos_at: {channel: bazos_at, market: AT}
  sbazar: {channel: sbazar, market: CZ}
  hardverapro: {channel: hardverapro, market: HU}
  marktplaats: {channel: marktplaats, market: NL}
  2ememain: {channel: 2ememain, market: BE}
  tori: {channel: tori, market: FI}

# Part-out valuation of whole PCs (dh/partout.py): sum of per-part P25/median/P75, less a parting-out cost and the
# outbound shipping of every part but the first (the net engine already charges one outbound leg).
partout:
  parting_cost: 0.12          # share of the parts' value lost to listing, haggling, returns and unsold leftovers
  heavy_parts: 3              # effort is heavy from this many detected parts (valued or not)
  max_components: 6
  min_comps: 3                # a part with fewer agreeing comps is unvalued (one stray ask is not a market price)
  exit_channel: allegro       # channel the parts are valued on (falls back like any other estimate)

# Parcel inbound (PLN, gross) when the frozen non-EU default (200) is a European envelope, not a boxed
# GPU from overseas. Duty and import VAT still come from the economics engine. An estimate, not a quote.
inbound_pln_override:
  US: 500
  CA: 500
  BR: 550
