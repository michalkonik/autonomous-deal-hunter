base_url: http://localhost:8080/v1
roles:
  worker: gemma-4-26b-a4b-pool
  senior: qwen3.8-flash-next-uncensored
  advisor: qwen3.8-flash-next-uncensored
# Paid endpoint for chosen roles. OFF by default and capped: with monthly_cap_usd 0 (default) no paid call is ever made;
# otherwise the LLM client refuses a paid call once this calendar month's paid spend (books, UTC) reaches the cap.
paid_api:
  enabled: false
  monthly_cap_usd: 0
  base_url: null              # OpenAI-compatible endpoint, e.g. https://api.example.com/v1
  api_key_secret: null        # bw-secret reference, e.g. "paid-llm#api_key"; never stored in the repo or DB
  roles: {}                   # role -> model name on that endpoint, e.g. {advisor: some-model}; unlisted roles stay local
  usd_per_mtok_in: 0
  usd_per_mtok_out: 0
  pln_per_usd: 4.0            # only to show the spend in PLN in the books
# More OpenAI-compatible providers, each with its own key and monthly cap. A role listed here is NOT loaded
# on llama-swap. Put the real block in config/local/models.yaml. The key is a bw-secret reference, never the value.
# Cap 0 refuses every call to that provider. enabled: false drops the whole block. One role, one provider.
# providers:
#   grok:    {base_url: https://api.x.ai/v1, api_key_secret: grok#api_key, monthly_cap_usd: 0, roles: {advisor: grok-4.7}}
#   gemini:  {base_url: https://generativelanguage.googleapis.com/v1beta/openai, api_key_secret: gemini#api_key, monthly_cap_usd: 0, roles: {}}
#   claude:  {base_url: https://api.anthropic.com/v1, api_key_secret: claude#api_key, monthly_cap_usd: 0, roles: {}}
#   chatgpt: {base_url: https://api.openai.com/v1, api_key_secret: openai#api_key, monthly_cap_usd: 0, roles: {}}
providers: {}
min_free_ram_gb: 12
timeouts: {connect_s: 5, read_s: 60}
breaker: {failures: 3, cooldown_s: 120}
worker: {parallel: 4}   # LLM worker slots used by the round scheduler (gemma pool serves 4 in parallel)
llama_swap_url: http://localhost:8080   # llama-swap control API (/running, /unload) for dh start/stop
