fetch:
  user_agent: "DealHunter/0.1 (personal price research; +https://github.com/michal-koniu)"
  min_interval_s: 4
  jitter_s: 2
  backoff_start_s: 60
  backoff_cap_s: 3600
  disable_after_blocks: 3
  robots_ttl_s: 86400
  obey_robots: false   # owner 2026-11-12: robots.txt is not a reason to skip a public page. 403, 429 and challenge pages still stop the fetcher. No proxies, no captcha solving, no logged-in scraping.
  max_crawl_delay_s: 60
  timeout_s: 30
  proxies: false
  solve_captcha: false
  logged_in: false
adapters:
  allegro: {enabled: true, via: api}   # official REST GET /offers/listing. Keys: bw-secret allegro#client_id / #client_secret. User-Agent is deal-hunter/1.0 (+https://github.com/michalkonik/family-finance-planner) unless adapters.allegro.user_agent overrides it. HTML is never fetched. Saved-search mail still arrives through mailbox.
  olx: {enabled: true, via: mailbox}   # OLX blocks polite polling: saved-search alert e-mails only
  mailbox:                             # IMAP alert mailbox; enable once `bw-secret dh-mail#imap` exists
    enabled: false
    image_hosts:                       # a mail's photos are kept only from these hosts (https, suffix match)
      allegro: [allegroimg.com]
      olx: [olxcdn.com]
      kleinanzeigen: [kleinanzeigen.de, classistatic.de]
      ebay: [ebayimg.com]
  vinted: {enabled: false}
  ebay: {enabled: true, via: api}   # all ebay_* markets, including ebay_us, ebay_ca, and ebay_br. Keys: ebay#client_id / #client_secret, then ebay2, ebay3, … up to ebay8. A missing client_id ends the list. One key backs off on 429/403; extra keys switch on 429. Foreign markets return only items the seller ships to PL. ebay_br is not an eBay site: the US catalog filtered to itemLocationCountry BR plus deliveryCountry PL. There is no EBAY_BR marketplace id.
  pepper_pl: {enabled: true, via: rss}
  hotukdeals: {enabled: true, via: rss}
  retail: {enabled: true}
  allegro_lokalnie: {enabled: true}
  sprzedajemy: {enabled: true}
  refurbed: {enabled: true, via: html}   # refurbed.pl search page 1 only. Price includes delivery in Poland. The struck "(Nowa)" price is ignored.
  taniekomputery: {enabled: true, via: html}   # Polish refurbished shop. Category page, first screen. The struck price-old amount is ignored.
  asgoodasnew: {enabled: true, via: html}   # German refurbished shop. Search page 1 (32 articles). Price is the grade amount without the voucher code. Ships to Poland (DHL, 10,90 EUR).
  amso: {enabled: true, via: html}   # Kraków poleasing shop. Search page 1. strong.price is the offer. Unavailable rows are skipped.
  luxtrade: {enabled: true, via: html}   # Polish refurbished phones. Search page 1. span.price is the grade offer. The content URL is that grade. Up to 24 months warranty. Delivery in Poland.
  devicestore: {enabled: true, via: html}   # device.store, Bydgoszcz, ex-lease gear in EUR. Search page 1. strong.price is the gross offer. Delivery in Poland.
  gebrauchtetechnik: {enabled: true, via: html}   # gebrauchte-technik.de. Search page 1. span.product-price is the offer, not the list price. Ships to Poland for 9,99 EUR.
  swappie: {enabled: false, reason: "Polish iPhone category returned 403 on 2026-11-13; not worked around"}
  subito: {enabled: false, reason: "robots.txt returned 403 (access denied) on 2026-11-12"}
  blocket: {enabled: false, reason: "robots.txt prohibits automated crawling without written permission (checked 2026-11-12)"}
  backmarket: {enabled: false, reason: "laptop category returned 403 on 2026-11-12; not worked around"}
  afbshop: {enabled: false, reason: "shipping page lists DE, AT, BE, IT and ES, not Poland (checked 2026-11-13)"}
  computeruniverse: {enabled: false, reason: "homepage returned 403 on 2026-11-13; not worked around"}
  cex: {enabled: false, reason: "Poland search page had no product cards; catalog JSON returned 403 (2026-11-13)"}
  itsco: {enabled: false, reason: "ships to Poland, but the card price is the bulk from-price and search returned 500 (2026-11-13)"}
  clevertronic: {enabled: false, reason: "homepage returned 403 (a challenge page) on 2026-11-13"}
  wisetek: {enabled: false, reason: "ships to Poland, but search and the catalog JSON returned 429 on 2026-11-13; not worked around"}
  lapstore: {enabled: false, reason: "Poland delivery is only for commercial resellers, not a private address (checked 2026-11-13)"}
  kleinanzeigen: {enabled: true}
  hardverapro: {enabled: true}
  marktplaats: {enabled: true}
  2ememain: {enabled: true}
  tori: {enabled: true}
  # Bazos: search is disallowed by robots.txt; category listing pages only, filtered locally.
  bazos_cz: {enabled: true, pages: 2}
  bazos_sk: {enabled: true, pages: 2}
  bazos_at: {enabled: false, pages: 2, reason: "almost no volume: /grafikkarten/ and /notebooks/ list 0 ads"}
  willhaben: {enabled: false, reason: "robots.txt header forbids automatic access without permission (checked 2026-10-29); keyword search and paging are also Disallowed"}
  sbazar: {enabled: false, reason: "robots.txt disallows all paths for non-Google agents"}
# Retail price watch (dh/sources/retail.py). Product or category pages carrying JSON-LD offers.price; emits a listing on a
# >= drop_pct fall vs the last seen price or below the key's clears-at P25, and feeds retail_new comps (the ceiling).
# Checked 2026-10-29 with the polite Fetcher: morele.net and x-kom.pl pass robots.txt and serve JSON-LD;
# mediaexpert.pl answers 403 (bot interstitial) and komputronik.pl category pages answer 403 (challenge): dropped, not circumvented.
retail:
  drop_pct: 0.10
  watch:
    - {shop: morele, url: "https://www.morele.net/kategoria/karty-graficzne-12/"}
    - {shop: xkom, url: "https://www.x-kom.pl/p/1317828-karta-graficzna-nvidia-msi-geforce-rtx-5070-ti-ventus-3x-oc-16gb-gddr7-dlss5.html"}
    - {shop: xkom, url: "https://www.x-kom.pl/p/1318500-karta-graficzna-nvidia-msi-geforce-rtx-5070-gaming-trio-oc-12gb-gddr7-dlss5.html"}
    - {shop: xkom, url: "https://www.x-kom.pl/p/1318534-karta-graficzna-nvidia-gigabyte-geforce-rtx-5070-windforce-oc-12gb-gddr7-dlss5.html"}
    - {shop: xkom, url: "https://www.x-kom.pl/p/1321564-karta-graficzna-amd-gigabyte-radeon-rx-9070-xt-gaming-oc-16gb-gddr6.html"}
    - {shop: xkom, url: "https://www.x-kom.pl/p/1309815-karta-graficzna-nvidia-gigabyte-geforce-rtx-5090-windforce-oc-32gb-gddr7-dlss5.html"}
retention: {photos_days: 90, snapshots_days: 90}   # photo hashes; raw snapshots and saved alert mails (the daily purge)
