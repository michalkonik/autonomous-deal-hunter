# Scam score (dh/risk.py): p_scam = 1 / (1 + exp(-(bias + sum of weight * feature))), features 0/1.
# Reasoning (controller ruling, review round 1): a deep discount ALONE must not block tier 1 (stale-priced
# listings from established sellers are the core play in a rising market), but a deep discount PLUS a
# weak-seller signal is a scam until proven otherwise. With bias -4.5:
#   normal listing                         -4.5            -> 1.1%   (< 2%)
#   too_cheap alone (established seller)   -4.5+1.4 = -3.1 -> 4.3%   (< 5%)
#   too_cheap + new account                -4.5+1.4+2.6=-0.5 -> 37.8% (> 30%)
#   too_cheap + 0 ratings                  -4.5+1.4+2.4=-0.7 -> 33.2% (> 20%)
#   extreme (< 35% of median) + any one weak signal: -4.5+1.4+2.5+(>=2.0) >= 1.4 -> >= 80% (> 50%)
risk:
  new_account_days: 30
  z_threshold: -2.5
  z_sigma_floor: 0.15      # log-price sigma is never below this, so tight comps do not make normal prices look extreme
  extreme_price_frac: 0.35 # price below this fraction of the median is "extreme" (also counts as too_cheap)
  scam_kw_max_hits: 2
  weights:
    bias: -4.5
    too_cheap: 1.4         # robust z of the price against the median < z_threshold
    extreme_price: 2.5     # price < extreme_price_frac x median
    new_account: 2.6       # seller account younger than new_account_days
    no_ratings: 2.4        # seller has 0 ratings
    stock_photo: 2.0       # stock-photo hint from the M2 photo checks
    origin_cn_hk: 2.0      # ships from CN/HK, high-end RTX key (see risk._CN_HK_MODELS)
    no_photos_flagship: 2.0  # no photos at all, 4090/5090 family key
    scam_kw: 0.8           # per scam_kw playbook hit, capped at scam_kw_max_hits
