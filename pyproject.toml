[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "curl_cffi", "selectolax", "pyyaml", "rapidfuzz", "feedparser", "jinja2",
  "starlette", "uvicorn", "httpx", "imagehash", "pillow", "python-multipart", "playwright",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
dh = "dh.cli:main"

[tool.setuptools]
packages = ["dh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real network endpoints; skipped by default, run with --live"]
